name: Flight Tracker

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      origin:
        description: 'Departure Airport (IATA)'
        required: true
        default: 'ORD'
      destination:
        description: 'Arrival Airport (IATA)'
        required: true
        default: 'DEL'
      depart_date:
        description: 'Outbound Date (YYYY-MM-DD)'
        required: true
        default: '2026-12-11'
      price_threshold:
        description: 'Alert Price Threshold (USD)'
        required: true
        default: '800'

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run flight price tracker
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ORIGIN: ${{ inputs.origin || 'ORD' }}
          DESTINATION: ${{ inputs.destination || 'DEL' }}
          DEPART_DATE: ${{ inputs.depart_date || '2026-12-11' }}
          PRICE_THRESHOLD: ${{ inputs.price_threshold || '800' }}
        run: python tracker.py